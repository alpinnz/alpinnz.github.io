name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install
        run: yarn --frozen-lockfile

      - name: Lint
        run: yarn -s lint

      - name: Typecheck
        run: yarn -s typecheck

      - name: Build
        run: yarn -s build
