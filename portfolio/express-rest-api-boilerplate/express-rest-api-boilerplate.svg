<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Express REST API Boilerplate</title>
  <desc id="description">An Express API request moving through validation, application services, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/><stop offset="1" stop-color="#24346a"/>
    </linearGradient>
    <linearGradient id="accent" x1="730" y1="170" x2="1060" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a5b4fc"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <path fill="url(#background)" d="M0 0h1200v675H0z"/>
  <circle cx="965" cy="305" r="285" fill="#818cf8" opacity=".08"/>
  <text x="78" y="96" fill="#a5b4fc" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">EXPRESS 5 · TYPESCRIPT · POSTGRESQL</text>
  <text x="78" y="193" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">A reliable base</text>
  <text x="78" y="254" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">for REST APIs.</text>
  <text x="80" y="312" fill="#c4cce2" font-family="Arial,sans-serif" font-size="22">Auth, roles, persistence, and API contracts.</text>
