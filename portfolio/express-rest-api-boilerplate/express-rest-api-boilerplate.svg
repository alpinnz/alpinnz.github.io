  <rect x="750" y="368" width="284" height="66" rx="15" fill="#242f58" stroke="#818cf8" stroke-opacity=".32"/>
  <text x="804" y="409" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="19" font-weight="700">Service + Sequelize</text>
