  <text x="105" y="390" fill="#e0e7ff" font-family="Arial,sans-serif" font-size="17" font-weight="700">Domain-based modules</text>
  <path d="M78 521h404" stroke="#fff" stroke-opacity=".16"/>
  <text x="78" y="562" fill="#aab5d0" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">EXPRESS REST API BOILERPLATE</text>
  <rect x="680" y="127" width="425" height="420" rx="26" fill="#151f3d" stroke="#a5b4fc" stroke-opacity=".32" stroke-width="2"/>
  <rect x="710" y="157" width="365" height="60" rx="13" fill="#222f56"/>
  <circle cx="739" cy="187" r="7" fill="#a5b4fc"/>
  <text x="764" y="194" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="18" font-weight="700">POST /api/v1/auth/login</text>
  <path d="M892 228v30m0 77v29m0 77v29" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m884 251 8 9 8-9m-16 100 8 9 8-9m-16 106 8 9 8-9" fill="none" stroke="#a5b4fc" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
