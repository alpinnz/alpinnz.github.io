<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Hono REST API Starter</title>
  <desc id="description">Diagram of an API request flowing through authentication, services, and PostgreSQL.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12212a"/><stop offset="1" stop-color="#173f41"/>
    </linearGradient>
    <linearGradient id="accent" x1="706" y1="178" x2="1076" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5eead4"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <path fill="url(#background)" d="M0 0h1200v675H0z"/>
  <circle cx="970" cy="300" r="270" fill="#2dd4bf" opacity=".07"/>
  <text x="78" y="96" fill="#7dd3fc" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3">TYPESCRIPT · BUN · HONO</text>
  <text x="78" y="193" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">A clearer start</text>
  <text x="78" y="254" fill="#fff" font-family="Arial,sans-serif" font-size="52" font-weight="700">for REST APIs.</text>
  <text x="80" y="312" fill="#b9d2d2" font-family="Arial,sans-serif" font-size="22">Authentication, data, and release flow.</text>
  <rect x="78" y="362" width="190" height="44" rx="22" fill="#2dd4bf" opacity=".13" stroke="#5eead4" stroke-opacity=".45"/>
  <text x="107" y="390" fill="#ccfbf1" font-family="Arial,sans-serif" font-size="17" font-weight="700">Modular foundation</text>
  <path d="M78 521h404" stroke="#fff" stroke-opacity=".16"/>
  <text x="78" y="562" fill="#9db8bb" font-family="Arial,sans-serif" font-size="16" letter-spacing="1">HONO REST API STARTER</text>
  <rect x="680" y="142" width="425" height="390" rx="26" fill="#0d252b" stroke="#5eead4" stroke-opacity=".3" stroke-width="2"/>
  <rect x="709" y="170" width="367" height="58" rx="13" fill="#183840"/>
  <circle cx="737" cy="199" r="7" fill="#5eead4"/>
  <text x="762" y="206" fill="#e2f8f5" font-family="Arial,sans-serif" font-size="19" font-weight="700">POST /api/auth/login</text>
  <path d="M886 238v32m0 78v31" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <path d="m878 263 8 9 8-9m-16 110 8 9 8-9" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="747" y="276" width="278" height="67" rx="15" fill="#1d4248" stroke="#5eead4" stroke-opacity=".25"/>
  <text x="792" y="317" fill="#d6fbf4" font-family="Arial,sans-serif" font-size="20" font-weight="700">Auth + service layer</text>
  <rect x="747" y="385" width="278" height="67" rx="15" fill="#1d4248" stroke="#38bdf8" stroke-opacity=".25"/>
  <text x="805" y="426" fill="#d9f4fc" font-family="Arial,sans-serif" font-size="20" font-weight="700">Prisma + Postgres</text>
  <text x="742" y="492" fill="#9db8bb" font-family="Arial,sans-serif" font-size="15">Configured, documented, repeatable</text>
