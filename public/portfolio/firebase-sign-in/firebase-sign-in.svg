  <path d="m878 369 8 10 8-10" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="759" y="385" width="254" height="72" rx="17" fill="#3a315e" stroke="#c4b5fd" stroke-opacity=".4"/>
  <text x="798" y="428" fill="#f5f3ff" font-family="Arial,sans-serif" font-size="20" font-weight="700">Firebase session</text>
  <text x="751" y="491" fill="#a8b5cb" font-family="Arial,sans-serif" font-size="15">Auth state · errors · persistence</text>
